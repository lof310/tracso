[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracso"
version = "1.0.0"
description = "Trace shared-object origins of a running process"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Leinier Orama", email = "lof310w@gmail.com" },
]
keywords = [
    "profiler",
    "tracer",
    "shared-objects",
    "dependencies",
    "python-packaging",
    "python-dependency",
    "elf",
    "sre",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

# No required runtime dependencies.
# The tool falls back to stdlib-only behavior when optional deps
# are missing, textual and loguru are pure ergonomics.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.40"]
log = ["loguru>=0.7"]
all = ["textual>=0.40", "loguru>=0.7"]

[project.scripts]
tracso = "tracso.cli:main"

[project.urls]
Homepage = "https://github.com/lof310/tracso"
Repository = "https://github.com/lof310/tracso"
Issues = "https://github.com/lof310/tracso/issues"
Changelog = "https://github.com/lof310/tracso/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["tracso"]

[tool.hatch.build.targets.sdist]
include = [
    "tracso/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "requirements.txt",
]

# --- tooling ---

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501",  # long lines handled by formatter
    "B008",  # function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tracso/utils.py" = ["E402"]  # SITE_CODE / INJECT_CODE string literals

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["tracso"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
